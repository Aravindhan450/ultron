name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Fresh install (proven flow)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Test (pytest)
        run: python -m pytest -q

  stress:
    name: stress + audit harness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fresh install (proven flow)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run stress + audit harness
        # Catches regressions the unit suite can miss — e.g. the web_search /
        # search_web action-name mismatch that silently broke batched searches.
        # The harness exits non-zero on any failed check.
        run: python _stress_audit.py
