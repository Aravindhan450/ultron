# Configuration for local LLM runtimes
# llama_cpp is the default runtime for Project Ultron

llama_cpp:
  enabled: true
  base_url: "http://127.0.0.1:8080"
  default_model: "default"
  context_length: 8192
  n_gpu_layers: -1  # Offload all layers to GPU by default if supported

mlx:
  enabled: false
  default_model: "mlx-community/Meta-Llama-3-8B-Instruct-4bit"


